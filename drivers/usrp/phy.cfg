# ==========================================================================
#  phy.cfg — sdr_system PHY options, every one set to its DEFAULT value.
#  Change only what you need, then run:  ./sdr_system --config phy.cfg
#  Anything on the COMMAND LINE overrides this file, e.g.:
#     ./sdr_system --config phy.cfg --scheme QPSK --rx-gain 22
#  Lines starting with '#' are ignored. Use the long name without '--'.
#  Auto-generated from `sdr_system --help` — edit values, not the layout.
# ==========================================================================

# Operation mode: source or sink
mode = source

# tx = transmit only (one B210), rx = receive only (other B210), source_arq
#   / sink_arq = the two ends of stop-and-wait ARQ, sense =
#   channel-occupancy sensing (RX energy over a window, no decode), both =
#   original single-box full-duplex/loopback
role = both

# role tx: how many times to cycle through all chunks (one-way, no ACK)
tx-reps = 20

# role rx: auto-stop and print the message after this many seconds with no
#   new bursts (TX has finished). 0 = run until Ctrl-C
rx-idle-timeout = 8

# role rx: stop as soon as every chunk of a finite message (bytes /
#   fixed-length random) is CRC-verified (default true). false = keep
#   receiving (collect duplicates / measure the link) until the idle timeout
#   or Ctrl-C. Ignored for continuous TX.
stop-on-complete = 1

# role rx: emit one machine-readable line per CRC-OK burst — '[BURST]
#   id=<payload byte0> idx=<i> tot=<t> nbytes=<n> hex=<HEX>' — for the MARL
#   multi-agent AP to route an ACK to the transmitting agent (payload byte 0
#   = agent id). No effect on the decoded message.
marl-report = 0

# ARQ ACK channel: tcp (default, ACK over a socket — no reverse RF needed)
#   or rf (ACK over the second RF path, RF B)
ack-transport = tcp

# TCP ACK: host/IP of the sink that the source connects to (default
#   localhost)
ack-host = 127.0.0.1

# TCP ACK: socket port
ack-port = 5599

# bypass the startup rate-chain consistency check (run even if rates
#   mismatch)
skip-rate-check = 0

# capture TX/RX signals and auto-save the plot to
#   <viz-dir>/<scheme>/figure.png (default true; --viz false disables)
viz = 1

# base directory for --viz output, relative to the working directory (a
#   per-modulation subfolder is made). Defaults under results/ so a run does
#   not scatter output across the repo root.
viz-dir = results/phy_outputs

# ACK timeout in ms (source)
timeout = 3000

# sink FIFO poll interval in ms — this SETS the ACK round-trip latency, so
#   keep it small (was 1000, which made ARQ ~5x slower)
timer_interval = 20

# source_arq: give up on a chunk after this many un-ACKed sends. 0 = never
#   give up (keeps TX/RX in lockstep on a marginal link, since a given-up
#   chunk desyncs a paired sender/receiver loop).
max-attempts = 50

# sink_arq: act as a persistent access point — keep the radio warm and
#   re-accept a new source per session instead of exiting after one message
#   (for fire-on-demand random access, e.g. the MARL bridge).
serve-forever = 0

# source_arq: warm transmitter — keep the radio warm and send ONE packet
#   each time a line is read on stdin, printing 'RESULT acked=0|1' per fire.
#   No per-fire radio re-init (pairs with a --serve-forever AP).
on-demand = 0

# Payload bits per packet
num_bits = 1000

# TX interval between packets (ms)
interval = 3000

# role tx transmission mode: burst (discrete packets/tone bursts with
#   --interval gaps, repeated --tx-reps times then stop) or continuous
#   (transmit until Ctrl-C — a continuous data loop or an unbroken carrier
#   for sine/cosine)
tx-mode = burst

# payload: bytes (given text, default Star Wars crawl; set with --message) |
#   random (num_bits random bits) | sine | cosine (raw baseband test tone) |
#   chirp (LoRa/CSS up-chirp sweep; see --chirp-bw/--chirp-sf) — raw
#   waveforms are role tx/rx only)
message-type = bytes

# text payload for --message-type bytes (overrides the default Star Wars
#   crawl)
# message =

# payload bytes per chunk (default 125). Larger chunks amortise the
#   per-burst detect/sync/ACK overhead — higher throughput. MUST match on TX
#   and RX. Total chunks <= 255.
bytes-length = 125

# TX: send the raw bytes of this file as the payload (binary, e.g. a
#   serialized gradient). Overrides --message / --message-type.
# payload-file =

# RX (rx / sink_arq): write the decoded payload as raw bytes to this file
#   (pairs with --payload-file for a binary byte-pipe).
# out-file =

# rx / sink_arq: file with the KNOWN transmitted message; every rejected
#   burst is then scored against it, printing pre-FEC BER vs the closest
#   chunk. ~50% = the bits are not framed where sync thinks they are; a few
#   % = link margin; ~0% = only the header/CRC disagrees.
# ber-expected =

# role sense: energy-integration window in ms (default 10)
sense-window = 10

# role sense: channel is 'busy' when the window's avg power (dB) exceeds
#   this. Calibrate to your gain/noise floor (channel_sense.py can
#   auto-calibrate).
sense-threshold-db = -30

# role sense: number of consecutive windows to measure/report (0 = stream
#   forever until Ctrl-C — for a persistent sensing feed)
sense-count = 1

# sine/cosine baseband frequency in Hz (default 100 kHz)
tone-freq = 100000

# sine/cosine amplitude, keep < 1.0 to avoid DAC clipping
tone-amp = 0.5

# LoRa/CSS chirp sweep bandwidth in Hz (--message-type chirp); 0 = full
#   sampled band (tx-rate)
chirp-bw = 0

# LoRa spreading factor 7-12; chirp symbol duration = 2^SF / bandwidth
chirp-sf = 7

# generate a down-chirp instead of an up-chirp (default up)
chirp-down = 0

# Preamble type: m-sequence or zadoff
preamble = m-sequence

# m-sequence order (length = 2^m-1)
m = 5

# Prepend preamble to each packet
add_preamble = 1

# TX pulse-shaper upsampling factor (wire sps = U/D)
U = 2

# TX pulse-shaper downsampling factor (wire sps = U/D)
D = 1

# Filter type: rrc / rc / lp
filter_type = rrc

# Symbol rate (Hz)
symbol_rate = 800000

# Filter tap count
num_taps = 151

# Roll-off factor
roll_off = 0.25

# FFT threads
num_threads = 1

# UHD TX device args (e.g. serial=XXXXXXX)
# tx-args =

# TX sample rate (Hz) = symbol_rate * U/D
tx-rate = 1600000

# TX centre frequency (Hz)
tx-freq = 2412000000

# TX gain (dB)
tx-gain = 20

# TX bandwidth (Hz)
tx-bw = 1000000

# TX antenna port
tx-ant = TX/RX

# TX channel index
tx-channel = 0

# TX subdev spec
tx-subdev = A:A

# UHD RX device args
# rx-args =

# RX sample rate (Hz) = tx_rate (integer samples/symbol)
rx-rate = 1600000

# RX centre frequency (Hz)
rx-freq = 2412000000

# RX gain (dB)
rx-gain = 30

# RX bandwidth (Hz)
rx-bw = 1000000

# RX antenna port
rx-ant = RX2

# RX channel index
rx-channel = 0

# RX subdev spec
rx-subdev = A:A

# Clock reference: internal / external / mimo
ref = internal

# Settling time (s)
settling = 0.20000000000000001

# UHD TX timeout (ms)
uhd_timeout = 1000

# Energy-detector IIR smoothing: filtered = (1-alpha)*inst + alpha*prev, so
#   LARGER alpha = MORE smoothing. The old 0.02 barely smoothed, so the
#   detector fired on every noise spike (thousands of false bursts) and cut
#   real bursts apart on the RRC envelope. 0.95 (~20-sample time constant)
#   gives one clean capture per burst.
alpha = 0.949999988

# Fixed energy threshold (used only if the adaptive detector is off). Alias:
#   --det-threshold
energy_threshold = 1.00000001e-07

# alias for --energy_threshold (fixed detector threshold)
# det-threshold =

# Samples to collect after energy detection
energy_packet_size = 3300

# IIR window size
IIR_window_size = 20

# Use the auto (adaptive) detection threshold = noise_floor × multiplier.
#   Alias: --det-adaptive
IIR_threshold_adaptive = 1

# alias for --IIR_threshold_adaptive (use the auto detector threshold)
# det-adaptive =

# Auto detector threshold = measured noise_floor × this. RAISE it
#   over-the-air (e.g. 10-30) so the detector fires only on real bursts, not
#   ambient RF; too high and it misses weak bursts. Alias: --det-mult
IIR_threshold_multiplier = 5

# alias for --IIR_threshold_multiplier (auto-threshold noise multiplier)
# det-mult =

# Continuously re-track the noise floor during idle (default true), vs a
#   one-shot startup calibration. Robust to drifting ambient noise.
det-continuous = 1

# Samples per symbol at match-filter output
sps_sync = 5

# ACQ correlation threshold — raise it over-the-air so ambient-noise bursts
#   are rejected (a real preamble peaks near the preamble length ~31 after
#   AGC; noise correlates far lower). Watch the '[ACQ] Peak correlation'
#   lines and set it below the true peak but above the noise. Alias:
#   --sync-threshold
sync_threshold = 15

# alias for --sync_threshold (hyphenated spelling)
# sync-threshold =

# Data symbols to extract (QPSK: 1016bits/2bps=508)
recv_msg_len = 508

# Samples per UHD receive buffer
samps_per_buff = 10000

# Total samples to receive (0=continuous)
num_recv_request = 0

# AGC type: Feed or Closed
AGC_type = Feed

# Experimental per-burst DC-block high-pass on the RX (default false). A
#   gentle cutoff barely dents the cable leakage; an aggressive one distorts
#   the preamble and breaks sync — prefer --tx-dc-i/--tx-dc-q.
dc-block = 0

# Manual TX LO-leakage null, I component (normalized [-1,1]). Tune with
#   --tx-dc-q to minimize the RX DC spike on a direct cable (dense QAM).
tx-dc-i = 0

# Manual TX LO-leakage null, Q component (normalized [-1,1]).
tx-dc-q = 0

# Modulation: QPSK / DQPSK / DBPSK / 16-QAM / ...
scheme = QPSK

# Forward Error Correction (rate-1/2 K=7 convolutional + Viterbi). Corrects
#   bit errors so a noisy link decodes error-free; must match on both ends.
#   Halves the payload rate (2x the symbols).
fec = 0

# Soft-decision decode (needs --fec true). RX passes per-bit LLRs to the
#   decoder for ~2-3 dB coding gain vs hard-decision. Coherent schemes only
#   (differential fall back to hard). RX-side only; TX unaffected. For LDPC
#   this is the native decode path — recommended whenever --fec-type ldpc.
fec_soft = 0

# FEC code family (needs --fec true; must MATCH on both ends): conv =
#   rate-1/2 K=7 convolutional + Viterbi (default), ldpc = rate-1/2
#   systematic IRA/staircase LDPC + min-sum belief propagation, turbo =
#   rate-1/2 punctured PCCC (two (7,5) RSC + interleaver) + iterative
#   max-log-MAP BCJR. ldpc/turbo are soft-native — pair with --fec_soft.
fec-type = conv

# LDPC/turbo info-block size in bits. Payload is segmented into k-bit blocks
#   (last zero-padded); both ends MUST use the same k so the code matches.
#   Larger k codes better but adds latency.
ldpc-k = 256

# Tuning: max decoder iterations (LDPC belief-prop / turbo BCJR). 0 =
#   default (LDPC 50, turbo 6). Raise (e.g. turbo 8-12) if a marginal link
#   won't converge. Decoder-only — need not match the other end.
fec-iters = 0

# Tuning: min-sum (LDPC) / extrinsic (turbo) normalization scale, 0.7-0.9
#   typical. 0 = default 0.75. Decoder-only — need not match the other end.
fec-scale = 0

# Tuning: LDPC variable-node degree (default 3). Higher = denser code,
#   sometimes stronger. CHANGES the parity-check matrix, so BOTH ends must
#   match. Ignored by conv/turbo.
ldpc-col-weight = 3

# Waveform: sc (single-carrier) or ofdm. OFDM handles multipath/CFO natively
#   (per-subcarrier equalization) — best for dense QAM.
waveform = sc

# OFDM FFT size (number of subcarriers)
ofdm-fft = 64

# OFDM cyclic-prefix length (>= channel delay spread)
ofdm-cp = 16

# Transmit/receive even when UHD could not give the exact --tx-rate /
#   --rx-rate you asked for. Off by default: a coerced rate leaves the
#   preamble correlating but drifts the payload's symbol timing, so the link
#   syncs and then decodes garbage. Prefer a rate the device can hit exactly
#   (master_clock_rate / integer).
allow-rate-coercion = 0

# TX digital back-off for the single-carrier waveform, multiplied into every
#   sample before the DAC (1.0 = unchanged). fc32 full scale is 1.0, so if
#   [TX VALIDATE] reports a peak above that the DAC is clipping — which
#   distorts the payload while the preamble still correlates. Try 0.7, then
#   lower.
tx-scale = 1

# OFDM TX peak scaling (high PAPR — keep the DAC out of clipping)
ofdm-tx-peak = 0.5

# LoRa/CSS spreading factor 7-12 for --waveform lora (2^SF chips/symbol;
#   higher = more processing gain / range, slower)
lora-sf = 8

# LoRa network id (2 sync symbols after the preamble); RX rejects frames
#   with a different word. 18=0x12 private, 52=0x34 public. Must match TX &
#   RX
lora-sync-word = 18

# Samples per symbol (informational)
sps = 2

# Gardner TED loop bandwidth BnT
timing_loop_bw = 0.0149999997

# Gardner TED damping factor
timing_damping = 0.707000017

# Cross-burst CFO estimate smoothing (EMA alpha). 1.0=per-burst (cold LO,
#   default); <1.0 blends history (warm resident LO only, e.g. 0.5)
cfo_prior_alpha = 1

# Phase PLL loop bandwidth
phase_loop_bw = 0.0199999996

# Phase PLL damping factor
phase_damping = 0.707000017

# Number of equaliser taps
eq_taps = 11

# Equalizer NLMS step (used for DD tracking / real-preamble training)
eq_mu = 0.300000012

# Equalizer decision-directed tracking after training (default off: the
#   LS-trained eq is exact frozen; DD can diverge on noisy dense QAM)
eq_dd = 0

# Equaliser type: LMS / RLS / DFE / None. Default None: on a clean cabled
#   link no equaliser is needed, and the LMS loop currently DIVERGES on the
#   real signal (decision-directed error grows and destroys the symbols) —
#   verified on hardware, where None decodes the message and LMS produces
#   garbage. Leave None until the LMS/RLS/DFE update is debugged.
eq_type = None

